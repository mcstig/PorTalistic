name: SwiftLint

# By hand only, like the build workflow: GitHub → Actions → SwiftLint → Run workflow. The
# Xcode build phase lints locally when SwiftLint is installed. Put the `push:` and
# `pull_request:` triggers back to run it on every push again.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  SwiftLint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: GitHub Action for SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
